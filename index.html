<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanley Imports</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c10">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg: #0b0c10;
    --surface: #16181d;
    --surface-2: #1e2128;
    --gold: #c9a227;
    --gold-soft: rgba(201,162,39,0.15);
    --cream: #f5f1e8;
    --muted: #8a8a8a;
    --line: rgba(245,241,232,0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .serif {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  a { color: inherit; text-decoration: none; }

  .hero {
    padding: 56px 24px 32px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  .hero h1 {
    font-size: 2.6rem;
    margin: 0 0 6px;
    font-style: italic;
  }
  .hero p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
    letter-spacing: 0.03em;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(11,12,16,0.92);
    backdrop-filter: blur(10px);
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .search-row input {
    flex: 1;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--cream);
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
  }
  .search-row input::placeholder { color: var(--muted); }
  .icon-btn {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    position: relative;
  }
  .icon-btn .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--gold);
    color: #0b0c10;
    font-size: 0.65rem;
    font-weight: 600;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chip-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 0.82rem;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active {
    border-color: var(--gold);
    color: var(--gold);
    background: var(--gold-soft);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 20px 18px 100px;
  }
  .product-card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    cursor: pointer;
    position: relative;
  }
  .product-card .img-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--surface-2);
    overflow: hidden;
    position: relative;
  }
  .product-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .no-img {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 1.6rem;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
  }
  .heart {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(11,12,16,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    z-index: 2;
  }
  .heart.active { color: var(--gold); }
  .out-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(11,12,16,0.75);
    color: var(--muted);
    font-size: 0.65rem;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.03em;
  }
  .card-body { padding: 10px 12px 14px; }
  .card-body .name {
    font-size: 0.92rem;
    margin: 0 0 4px;
    line-height: 1.25;
  }
  .price-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .price {
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
  }
  .price-old {
    color: var(--muted);
    font-size: 0.78rem;
    text-decoration: line-through;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .serif { font-size: 1.4rem; color: var(--cream); display:block; margin-bottom:6px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: none;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--line);
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-img {
    width: 100%;
    aspect-ratio: 1/1;
    background: var(--surface-2);
    position: relative;
  }
  .modal-img img { width: 100%; height: 100%; object-fit: cover; }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(11,12,16,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    z-index: 3;
  }
  .modal-body { padding: 22px 22px 32px; }
  .modal-body h2 { font-size: 1.6rem; margin: 0 0 4px; font-style: italic; }
  .modal-body .price { font-size: 1.4rem; }
  .modal-body .desc-row { margin: 14px 0; font-size: 0.85rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  .modal-body .desc-row span b { color: var(--cream); }

  .qty-row { display: flex; align-items: center; gap: 14px; margin: 18px 0; }
  .qty-row button {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--cream); font-size: 1.1rem; cursor: pointer;
  }
  .qty-row .qty-val { font-size: 1.1rem; min-width: 20px; text-align: center; }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--gold);
    color: #0b0c10;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--cream);
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 10px;
  }

  .section-title {
    font-size: 1.15rem;
    margin: 26px 0 12px;
    font-style: italic;
  }
  .review-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .review-item .top { display: flex; justify-content: space-between; align-items: center; }
  .review-item .name { font-size: 0.88rem; font-weight: 500; }
  .review-item .stars { color: var(--gold); font-size: 0.8rem; }
  .review-item .comment { font-size: 0.85rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .no-reviews { color: var(--muted); font-size: 0.85rem; }

  .review-form { margin-top: 16px; }
  .review-form textarea, .review-form input {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--cream);
    font-size: 0.88rem;
    font-family: 'Inter', sans-serif;
    margin-bottom: 8px;
  }
  .review-form textarea { min-height: 60px; resize: vertical; }
  .star-picker { display: flex; gap: 6px; margin-bottom: 10px; font-size: 1.3rem; }
  .star-picker span { cursor: pointer; color: var(--muted); }
  .star-picker span.selected { color: var(--gold); }

  .panel-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: none;
  }
  .panel-overlay.open { display: block; }
  .panel {
    position: fixed;
    top: 0; right: 0;
    width: 88%;
    max-width: 360px;
    height: 100%;
    background: var(--bg);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    animation: slideLeft 0.25s ease-out;
  }
  @keyframes slideLeft {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  .panel-header {
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .panel-header h3 { margin: 0; font-style: italic; font-size: 1.3rem; }
  .panel-body { flex: 1; overflow-y: auto; padding: 12px 20px; }
  .panel-footer { padding: 16px 20px 24px; border-top: 1px solid var(--line); }
  .cart-line {
    display: flex;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    align-items: center;
  }
  .cart-line img {
    width: 50px; height: 50px; object-fit: cover; border-radius: 8px;
    background: var(--surface-2);
  }
  .cart-line .cl-info { flex: 1; }
  .cart-line .cl-name { font-size: 0.85rem; }
  .cart-line .cl-price { color: var(--gold); font-size: 0.8rem; margin-top: 2px; }
  .cart-line .cl-remove { color: var(--muted); font-size: 0.75rem; cursor: pointer; margin-top: 3px; }
  .cart-total-row {
    display: flex; justify-content: space-between;
    font-size: 1rem; margin-bottom: 12px;
  }
  .cart-total-row .price { font-size: 1.2rem; }

  .fab-row {
    position: fixed;
    bottom: 20px;
    right: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 15;
  }
  .fab {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    position: relative;
    cursor: pointer;
  }
  .fab .badge {
    position: absolute;
    top: -4px; right: -4px;
    background: var(--gold);
    color: #0b0c10;
    font-size: 0.65rem;
    font-weight: 600;
    width: 19px; height: 19px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); max-width: 900px; margin: 0 auto; }
    .modal-overlay { align-items: center; justify-content: center; }
    .modal { max-width: 420px; border-radius: 20px; max-height: 88vh; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>Shanley Imports</h1>
  <p>Curated pieces, sourced with care</p>
</div>

<div class="toolbar">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search products...">
    <div class="icon-btn" onclick="openWishlist()">
      ♡
      <span class="badge" id="wishBadge" style="display:none;">0</span>
    </div>
  </div>
  <div class="chip-row" id="categoryChips"></div>
</div>

<div class="grid" id="productGrid">
  <div class="empty-state"><span class="serif">Loading...</span></div>
</div>

<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-img" id="modalImgWrap">
      <div class="modal-close" onclick="closeModal()">✕</div>
    </div>
    <div class="modal-body">
      <h2 id="modalName"></h2>
      <div class="price-row">
        <span class="price" id="modalPrice"></span>
        <span class="price-old" id="modalOldPrice"></span>
      </div>
      <div class="desc-row" id="modalMeta"></div>

      <div class="qty-row">
        <button onclick="changeQty(-1)">−</button>
        <span class="qty-val" id="qtyVal">1</span>
        <button onclick="changeQty(1)">+</button>
      </div>

      <button class="btn-primary" id="addToCartBtn" onclick="addCurrentToCart()">Add to Cart</button>
      <button class="btn-secondary" onclick="toggleWishlistCurrent()" id="wishToggleBtn">♡ Add to Wishlist</button>

      <div class="section-title">Reviews</div>
      <div id="reviewsList"></div>

      <div class="review-form">
        <div class="star-picker" id="starPicker">
          <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
        </div>
        <input type="text" id="reviewName" placeholder="Your name">
        <textarea id="reviewComment" placeholder="Share your thoughts..."></textarea>
        <button class="btn-secondary" onclick="submitReview()">Post Review</button>
      </div>
    </div>
  </div>
</div>

<div class="panel-overlay" id="cartOverlay" onclick="closeCart(event)">
  <div class="panel" onclick="event.stopPropagation()">
    <div class="panel-header">
      <h3>Your Cart</h3>
      <span onclick="closeCart()" style="cursor:pointer;font-size:1.3rem;">✕</span>
    </div>
    <div class="panel-body" id="cartBody"></div>
    <div class="panel-footer">
      <div class="cart-total-row">
        <span>Total</span>
        <span class="price" id="cartTotal">GHS 0</span>
      </div>
      <button class="btn-primary" onclick="goToCheckout()">Proceed to Checkout</button>
    </div>
  </div>
</div>

<div class="panel-overlay" id="wishOverlay" onclick="closeWishlist(event)">
  <div class="panel" onclick="event.stopPropagation()">
    <div class="panel-header">
      <h3>Wishlist</h3>
      <span onclick="closeWishlist()" style="cursor:pointer;font-size:1.3rem;">✕</span>
    </div>
    <div class="panel-body" id="wishBody"></div>
  </div>
</div>

<div class="fab-row">
  <div class="fab" onclick="openCart()">
    🛍️
    <span class="badge" id="cartBadge" style="display:none;">0</span>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAscCVf9weQ3FRI4iiCQ-C0v2Vb_mzkOM0",
    authDomain: "shanley-imports-401a5.firebaseapp.com",
    projectId: "shanley-imports-401a5",
    storageBucket: "shanley-imports-401a5.firebasestorage.app",
    messagingSenderId: "379246463762",
    appId: "1:379246463762:web:e1b0a6900805d68b0c81cb",
    measurementId: "G-ZDF32CP3VX"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let allProducts = [];
  let activeCategory = 'all';
  let searchTerm = '';
  let currentProduct = null;
  let currentQty = 1;
  let selectedStars = 0;

  let cart = JSON.parse(localStorage.getItem('shanley_cart') || '[]');
  let wishlist = JSON.parse(localStorage.getItem('shanley_wishlist') || '[]');

  function saveCart() { localStorage.setItem('shanley_cart', JSON.stringify(cart)); updateBadges(); }
  function saveWishlist() { localStorage.setItem('shanley_wishlist', JSON.stringify(wishlist)); updateBadges(); }

  function updateBadges() {
    const cartBadge = document.getElementById('cartBadge');
    const wishBadge = document.getElementById('wishBadge');
    const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);
    cartBadge.style.display = cartCount > 0 ? 'flex' : 'none';
    cartBadge.textContent = cartCount;
    wishBadge.style.display = wishlist.length > 0 ? 'flex' : 'none';
    wishBadge.textContent = wishlist.length;
  }

  db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
    allProducts = [];
    snapshot.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
    renderCategories();
    renderGrid();
  }, err => {
    document.getElementById('productGrid').innerHTML =
      `<div class="empty-state"><span class="serif">Something went wrong</span>Please refresh the page.</div>`;
  });

  function renderCategories() {
    const cats = ['all', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
    const chipRow = document.getElementById('categoryChips');
    chipRow.innerHTML = cats.map(c =>
      `<div class="chip ${c === activeCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c === 'all' ? 'All' : c}</div>`
    ).join('');
  }

  function setCategory(c) {
    activeCategory = c;
    renderCategories();
    renderGrid();
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value.toLowerCase();
    renderGrid();
  });

  function renderGrid() {
    const grid = document.getElementById('productGrid');
    let filtered = allProducts.filter(p => {
      const matchCat = activeCategory === 'all' || p.category === activeCategory;
      const matchSearch = !searchTerm || (p.name || '').toLowerCase().includes(searchTerm);
      return matchCat && matchSearch;
    });

    if (!filtered.length) {
      grid.innerHTML = `<div class="empty-state"><span class="serif">Nothing here yet</span>Try a different search or category.</div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => {
      const isWished = wishlist.includes(p.id);
      const hasDiscount = p.discount && p.discount > 0;
      const finalPrice = hasDiscount ? (p.price * (1 - p.discount / 100)).toFixed(2) : p.price;
      const img = p.imageUrl
        ? `<img src="${p.imageUrl}" alt="${p.name}">`
        : `<div class="no-img">${(p.name || '?')[0]}</div>`;
      return `
        <div class="product-card" onclick="openProduct('${p.id}')">
          <div class="img-wrap">
            ${img}
            <div class="heart ${isWished ? 'active' : ''}" onclick="event.stopPropagation(); toggleWishlist('${p.id}')">${isWished ? '♥' : '♡'}</div>
            ${p.inStock === false ? '<div class="out-badge">Out of stock</div>' : ''}
          </div>
          <div class="card-body">
            <p class="name">${p.name}</p>
            <div class="price-row">
              <span class="price">GHS ${finalPrice}</span>
              ${hasDiscount ? `<span class="price-old">GHS ${p.price}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleWishlist(id) {
    if (wishlist.includes(id)) {
      wishlist = wishlist.filter(w => w !== id);
    } else {
      wishlist.push(id);
    }
    saveWishlist();
    renderGrid();
    if (currentProduct && currentProduct.id === id) updateWishToggleBtn();
  }

  function toggleWishlistCurrent() {
    if (currentProduct) toggleWishlist(currentProduct.id);
  }

  function updateWishToggleBtn() {
    const btn = document.getElementById('wishToggleBtn');
    const isWished = wishlist.includes(currentProduct.id);
    btn.textContent = isWished ? '♥ Remove from Wishlist' : '♡ Add to Wishlist';
  }

  window._reviewsCache = {};

  function openProduct(id) {
    currentProduct = allProducts.find(p => p.id === id);
    if (!currentProduct) return;
    currentQty = 1;
    selectedStars = 0;
    document.getElementById('qtyVal').textContent = 1;

    const imgWrap = document.getElementById('modalImgWrap');
    imgWrap.innerHTML = `<div class="modal-close" onclick="closeModal()">✕</div>` +
      (currentProduct.imageUrl
        ? `<img src="${currentProduct.imageUrl}" alt="${currentProduct.name}">`
        : `<div class="no-img" style="height:100%;">${(currentProduct.name||'?')[0]}</div>`);

    document.getElementById('modalName').textContent = currentProduct.name;
    const hasDiscount = currentProduct.discount && currentProduct.discount > 0;
    const finalPrice = hasDiscount ? (currentProduct.price * (1 - currentProduct.discount / 100)).toFixed(2) : currentProduct.price;
    document.getElementById('modalPrice').textContent = `GHS ${finalPrice}`;
    document.getElementById('modalOldPrice').textContent = hasDiscount ? `GHS ${currentProduct.price}` : '';

    const metaParts = [];
    if (currentProduct.category) metaParts.push(`<span><b>Category</b> ${currentProduct.category}</span>`);
    if (currentProduct.size) metaParts.push(`<span><b>Size</b> ${currentProduct.size}</span>`);
    document.getElementById('modalMeta').innerHTML = metaParts.join('');

    const addBtn = document.getElementById('addToCartBtn');
    if (currentProduct.inStock === false) {
      addBtn.textContent = 'Out of Stock';
      addBtn.disabled = true;
    } else {
      addBtn.textContent = 'Add to Cart';
      addBtn.disabled = false;
    }

    updateWishToggleBtn();
    document.querySelectorAll('#starPicker span').forEach(s => s.classList.remove('selected'));
    document.getElementById('reviewName').value = '';
    document.getElementById('reviewComment').value = '';

    loadReviews(id);
    document.getElementById('productModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('productModal').classList.remove('open');
    currentProduct = null;
  }

  function changeQty(delta) {
    currentQty = Math.max(1, currentQty + delta);
    document.getElementById('qtyVal').textContent = currentQty;
  }

  function addCurrentToCart() {
    if (!currentProduct) return;
    const existing = cart.find(c => c.id === currentProduct.id);
    if (existing) {
      existing.qty += currentQty;
    } else {
      const hasDiscount = currentProduct.discount && currentProduct.discount > 0;
      const finalPrice = hasDiscount ? +(currentProduct.price * (1 - currentProduct.discount / 100)).toFixed(2) : currentProduct.price;
      cart.push({ id: currentProduct.id, name: currentProduct.name, price: finalPrice, imageUrl: currentProduct.imageUrl || '', qty: currentQty });
    }
    saveCart();
    closeModal();
    openCart();
  }

  document.querySelectorAll('#starPicker span').forEach(star => {
    star.addEventListener('click', () => {
      selectedStars = parseInt(star.dataset.v);
      document.querySelectorAll('#starPicker span').forEach(s => {
        s.classList.toggle('selected', parseInt(s.dataset.v) <= selectedStars);
      });
    });
  });

  function loadReviews(productId) {
    const list = document.getElementById('reviewsList');
    list.innerHTML = '<p class="no-reviews">Loading reviews...</p>';
    db.collection('reviews').where('productId', '==', productId).orderBy('createdAt', 'desc').get()
      .then(snapshot => {
        const revs = [];
        snapshot.forEach(doc => revs.push(doc.data()));
        window._reviewsCache[productId] = revs;
        if (!revs.length) {
          list.innerHTML = '<p class="no-reviews">No reviews yet. Be the first!</p>';
          return;
        }
        list.innerHTML = revs.map(r => `
          <div class="review-item">
            <div class="top">
              <span class="name">${r.name}</span>
              <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
            </div>
            <p class="comment">${r.comment || ''}</p>
          </div>
        `).join('');
      })
      .catch(() => {
        list.innerHTML = '<p class="no-reviews">Reviews unavailable right now.</p>';
      });
  }

  function submitReview() {
    if (!currentProduct) return;
    const name = document.getElementById('reviewName').value.trim();
    const comment = document.getElementById('reviewComment').value.trim();
    if (!name || selectedStars === 0) {
      alert('Please add your name and select a star rating.');
      return;
    }
    db.collection('reviews').add({
      productId: currentProduct.id,
      name, comment, rating: selectedStars,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      document.getElementById('reviewName').value = '';
      document.getElementById('reviewComment').value = '';
      selectedStars = 0;
      document.querySelectorAll('#starPicker span').forEach(s => s.classList.remove('selected'));
      loadReviews(currentProduct.id);
    });
  }

  function openCart() {
    renderCart();
    document.getElementById('cartOverlay').classList.add('open');
  }
  function closeCart(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('cartOverlay').classList.remove('open');
  }

  function renderCart() {
    const body = document.getElementById('cartBody');
    if (!cart.length) {
      body.innerHTML = '<p class="no-reviews">Your cart is empty.</p>';
      document.getElementById('cartTotal').textContent = 'GHS 0';
      return;
    }
    body.innerHTML = cart.map(c => `
      <div class="cart-line">
        <img src="${c.imageUrl || ''}" onerror="this.style.display='none'">
        <div class="cl-info">
          <div class="cl-name">${c.name} × ${c.qty}</div>
          <div class="cl-price">GHS ${(c.price * c.qty).toFixed(2)}</div>
          <div class="cl-remove" onclick="removeFromCart('${c.id}')">Remove</div>
        </div>
      </div>
    `).join('');
    const total = cart.reduce((sum, c) => sum + c.price * c.qty, 0);
    document.getElementById('cartTotal').textContent = `GHS ${total.toFixed(2)}`;
  }

  function removeFromCart(id) {
    cart = cart.filter(c => c.id !== id);
    saveCart();
    renderCart();
  }

  function goToCheckout() {
    if (!cart.length) return;
    localStorage.setItem('shanley_checkout_cart', JSON.stringify(cart));
    window.location.href = 'checkout.html';
  }

  function openWishlist() {
    renderWishlist();
    document.getElementById('wishOverlay').classList.add('open');
  }
  function closeWishlist(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('wishOverlay').classList.remove('open');
  }

  function renderWishlist() {
    const body = document.getElementById('wishBody');
    const items = allProducts.filter(p => wishlist.includes(p.id));
    if (!items.length) {
      body.innerHTML = '<p class="no-reviews">Your wishlist is empty.</p>';
      return;
    }
    body.innerHTML = items.map(p => `
      <div class="cart-line" style="cursor:pointer;" onclick="closeWishlist(); openProduct('${p.id}')">
        <img src="${p.imageUrl || ''}" onerror="this.style.display='none'">
        <div class="cl-info">
          <div class="cl-name">${p.name}</div>
          <div class="cl-price">GHS ${p.price}</div>
        </div>
      </div>
    `).join('');
  }

  updateBadges();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
</script>

</body>
</html>
